# Painel + coletor atrás do Caddy, que emite e renova o certificado HTTPS.
#   cp deploy/.env.exemplo deploy/.env   (e preencha DOMINIO e EMAIL)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  painel:
    build:
      context: ..
      dockerfile: coletor/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      # com deputados nas zonas das capitais o coletor passa de 2 GB
      - NODE_OPTIONS=--max-old-space-size=${MEMORIA_MB:-3072}
    command: ["node", "coletor/servidor.mjs", "--coletar", "--saida", "/app/feed", "--paralelo", "${PARALELO:-12}", "--limite-tse", "${LIMITE_TSE:-60}", "--zonas", "${ZONAS:-capitais}", "--zonas-cargos", "${ZONAS_CARGOS:-1,3,5,6,7}", "--municipios", "${MUNICIPIOS:-1,3,5,6,7}", "--turno", "${TURNO:-0}", "--usuario", "node"]
    volumes:
      - feed:/app/feed
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/saude"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [painel]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMINIO=${DOMINIO}
      - EMAIL=${EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config

volumes:
  feed:
  caddy-dados:
  caddy-config:
